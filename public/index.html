<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="index.css">
    <title>Index</title>
</head>
<body>
<!-- Husk å bruk semantiske tagger -->
    <Header>
        <h1>Treningslogg</h1>
    </Header>

    <nav>
        <p id = "Navn"><!-- Fylt ut av JS --></p> 
        <a href="login.html">Logg ut</a>
    </nav>

    <table id = "tidlegare_okter">
        <tr>
            <th>Tidlegare Økter</th>
        </tr>
<!-- Disse blir fylt ut av javascript -->
        <tr>
            <td id = "utskrift1"></td>
        </tr>
            <tr>
            <td id = "utskrift2"></td>
        </tr>
        <tr>
            <td id = "utskrift3"></td>
        </tr>
    </table>

    <div id = "pågåendeØkt">
        <Header id = "øktHeader">
            <h3>Pågående treningsøkt</h3>
            <button id = "fullfør_økt" class="hidden">Fullfør Økt</button>
        </Header>
    </div>

    <div id = "forms">
        <form id = "ovelseForm" class = "hidden">
            <label for="name">Navnet til øvelsen:</label>
            <input type="text" for="name" id="name" required>
            <label for="muskel">Navnet til muskelen:</label>
            <input type="text" for="muskel" id="muskel" required>
            <button type="submit">Legg til</button>
        </form>

        <form id ="oektForm" class ="hidden">
            <label for="date">Dato: </label>
            <input type ="date" for="date" id ="date" required>
            <label for="oektType">Hvilken økt skal du ha?: </label>
            <input type="text" for="oektType" id="oektType" required>
            <button type = "submit">Legg til</button>
        </form>

        <form id="setForm" class ="hidden">
            <label for="øvelseSet">Øvelse: </label>
            <select for="øvelseSet" id = "øvelseSet" required></select>

            <label for="set-nr">Set-nr: </label>
            <input type="set-nr" id = "set-nr">

            <label for="vekt">Vekt: </label>
            <input type="text" for="vekt" id="vekt">

            <label for="reps">Reps: </label>
            <input type="number" for="reps" id="reps">

            <label for="rir">Rir: </label>
            <input type="number" for="rir" id="rir">

            <button type = "submit">Legg til</button>
        </form>
    </div>

    <div id = "knapper">
        <button id = "oektKnapp">Legg til økt</button>
        <button id = "ovelseKnapp">Legg til øvelse</button>
    </div>
    
</body>
</html>
